<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>AI Garage</title>
<style>
  :root{ --txt:#233d4d; --mut:#4d5e6a; --faint:#8a96a0; --accent:#fe7f2d; --teal-neon:#1ce5e8; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ display:flex; align-items:center; justify-content:center; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(820px 560px at 9% 3%, rgba(254,127,45,.08), transparent 55%),
      radial-gradient(820px 560px at 93% 1%, rgba(28,229,232,.12), transparent 55%),
      linear-gradient(180deg,#f5f6fa,#e8eaf1); }
  .box{ text-align:center; padding:0 30px; max-width:440px; }
  .logo{ width:88px; height:88px; margin:0 auto 18px; display:block; filter:drop-shadow(0 4px 9px rgba(20,20,45,.18)); }
  h1{ font-family:ui-rounded,-apple-system,"SF Pro Rounded",sans-serif; font-size:26px; letter-spacing:-.022em; margin:0 0 8px; }
  p{ color:var(--mut); font-size:14px; line-height:1.5; margin:0; }
  .spin{ width:26px; height:26px; margin:20px auto 0; border:3px solid rgba(20,20,45,.12);
    border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }
  .slow{ display:none; margin-top:16px; font-size:13px; color:var(--faint); line-height:1.5; }
  .slow.on{ display:block; }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo.png" alt="" onerror="this.remove()">
    <h1>AI Garage</h1>
    <p id="msg">Запускаю панель…</p>
    <div class="spin"></div>
    <div class="slow" id="slow">Дольше обычного. Панель стартует сама — окно откроется, как только она ответит.
      Закрывать приложение не нужно.</div>
  </div>
<script>
  // Окно открывается на этой странице МГНОВЕННО (вместо белого экрана), пока сервер на 7777 ещё поднимается.
  // Дальше нас перекинет на панель: либо Rust (win.navigate, основной путь), либо этот же поллинг — что раньше.
  const PANEL = "http://127.0.0.1:7777";
  let n = 0;
  async function poll(){
    n++;
    if(n > 12) document.getElementById("slow").classList.add("on");
    try{
      const r = await fetch(PANEL + "/api/status", { cache:"no-store" });
      // Обычно панель открывает Rust (он же и решает, когда сервер готов). Этот путь — запасной,
      // поэтому ждём пару секунд: так нет гонки и двойной загрузки страницы.
      if(r.ok && n > 5){ location.replace(PANEL); return; }
    }catch(e){}   // 7777 ещё не слушает или CORS — просто пробуем снова
    setTimeout(poll, 700);
  }
  poll();
</script>
</body>
</html>
