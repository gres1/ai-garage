<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>AI Garage · Orbit 3D</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<style>
  :root{ --txt:#e8ecff; --mut:#9aa6d4; --faint:#5b6591; --teal:#1ce5e8;
    --glass:rgba(20,28,64,.42); --glassbrd:rgba(120,150,255,.18); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; background:#03040c; color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; user-select:none; }
  #gl{ position:fixed; inset:0; z-index:0; display:block; touch-action:none; cursor:grab; }
  #gl.drag{ cursor:grabbing; }
  #loading{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#03040c; color:var(--mut); }
  .spin{ width:34px; height:34px; border:3px solid rgba(120,150,255,.2); border-top-color:var(--teal); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp{ to{ transform:rotate(360deg); } }

  /* хедер */
  header{ position:fixed; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:20px 28px; pointer-events:none; }
  .brand h1{ font-family:ui-rounded,-apple-system,sans-serif; font-size:22px; font-weight:800; letter-spacing:.12em;
    background:linear-gradient(90deg,#fff,#9fb4ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .brand .sub{ font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--faint); margin-top:3px; }
  .clock{ text-align:center; } .clock .t{ font-size:19px; font-weight:600; letter-spacing:.04em; } .clock .d{ font-size:12px; color:var(--mut); margin-top:2px; }
  .hbtns{ display:flex; gap:10px; pointer-events:auto; }
  .hbtn{ display:inline-flex; align-items:center; gap:7px; background:var(--glass); border:1px solid var(--glassbrd); color:var(--mut);
    border-radius:980px; padding:9px 15px; font-size:13px; font-weight:600; cursor:pointer; backdrop-filter:blur(12px); text-decoration:none; transition:.18s; }
  .hbtn:hover{ color:#fff; border-color:rgba(120,150,255,.5); box-shadow:0 0 24px rgba(120,150,255,.25); }
  .hbtn svg{ width:16px; height:16px; }

  /* HTML-подписи форм поверх 3D */
  .lbl{ position:fixed; z-index:10; transform:translate(-50%,-50%); pointer-events:none; text-align:center; transition:opacity .3s; }
  .lbl .nm{ font-size:13.5px; font-weight:700; text-shadow:0 2px 12px rgba(0,0,0,.8); white-space:nowrap; }
  .lbl .ct{ font-size:11px; margin-top:1px; } .lbl .ct b{ font-weight:700; }

  /* деталь */
  #detail{ position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:24px; background:rgba(3,4,12,.55); backdrop-filter:blur(10px); }
  #detail.show{ display:flex; animation:fade .25s ease; } @keyframes fade{ from{opacity:0} to{opacity:1} }
  .panel{ width:min(680px,94vw); max-height:82vh; overflow:auto; border-radius:24px;
    background:linear-gradient(180deg, rgba(22,30,66,.9), rgba(12,16,38,.94)); border:1px solid var(--glassbrd);
    box-shadow:0 30px 90px rgba(0,0,0,.6), 0 0 70px -18px var(--cc); }
  .phead{ position:sticky; top:0; display:flex; align-items:center; gap:14px; padding:20px 22px; backdrop-filter:blur(8px);
    background:linear-gradient(180deg, rgba(22,30,66,.92), rgba(22,30,66,.4)); border-bottom:1px solid var(--glassbrd); }
  .phead .orb{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    background:radial-gradient(circle at 40% 35%, var(--cc), transparent 72%); box-shadow:0 0 26px -2px var(--cc); color:#fff; }
  .phead .orb svg{ width:22px; height:22px; } .phead h2{ font-size:19px; font-weight:800; } .phead .pc{ font-size:12px; color:var(--mut); }
  .phead .x{ margin-left:auto; width:34px; height:34px; border-radius:50%; border:1px solid var(--glassbrd); background:var(--glass); color:var(--mut); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .phead .x:hover{ color:#fff; }
  .plist{ padding:14px 18px 22px; display:grid; gap:9px; }
  .item{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; background:rgba(120,150,255,.06); border:1px solid rgba(120,150,255,.1); }
  .item .dot{ width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--faint); box-shadow:0 0 8px var(--faint); }
  .item .dot.up{ background:#28e0a8; box-shadow:0 0 10px #28e0a8; } .item .dot.down{ background:#ff5a6a; box-shadow:0 0 10px #ff5a6a; } .item .dot.unk{ background:#ffc23d; box-shadow:0 0 10px #ffc23d; }
  .item .nm{ font-weight:650; font-size:14px; } .item .meta{ font-size:11.5px; color:var(--faint); }
  .item .right{ margin-left:auto; font-size:11.5px; color:var(--mut); } .item .av{ width:30px; height:30px; border-radius:9px; flex:0 0 auto; object-fit:cover; box-shadow:0 0 14px -4px var(--cc); }
  .empty{ padding:26px; text-align:center; color:var(--faint); font-size:13.5px; }

  .zoom{ position:fixed; bottom:26px; z-index:15; width:54px; height:54px; border-radius:50%; background:var(--glass); border:1px solid var(--glassbrd);
    backdrop-filter:blur(12px); color:var(--mut); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .zoom:hover{ color:#fff; border-color:rgba(120,150,255,.5); } #zoomOut{ left:34px; } #zoomIn{ right:34px; }
  .foot{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:15; display:flex; gap:22px; background:var(--glass);
    border:1px solid var(--glassbrd); border-radius:980px; padding:11px 22px; backdrop-filter:blur(12px); font-size:12.5px; color:var(--mut); }
  .foot span{ display:inline-flex; align-items:center; gap:7px; } .foot svg{ width:15px; height:15px; color:var(--teal); }
  @media (max-width:640px){ .foot{ display:none; } header{ padding:14px 16px; } }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="loading"><div class="spin"></div><div>Собираю пространство…</div></div>

  <header>
    <div class="brand"><h1>AI GARAGE</h1><div class="sub">Orbit 3D · пространство твоего мира</div></div>
    <div class="clock"><div class="t" id="clk">—</div><div class="d" id="clkd"></div></div>
    <div class="hbtns">
      <a class="hbtn" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg> Панель</a>
      <button class="hbtn" onclick="resetView()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg> Сброс</button>
    </div>
  </header>

  <div id="labels"></div>

  <button class="zoom" id="zoomOut" onclick="zoomBy(1)">−</button>
  <button class="zoom" id="zoomIn" onclick="zoomBy(-1)">+</button>
  <div class="foot"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5v14"/></svg> Тяни — вращать</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg> Колесо — зум</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11V6a2 2 0 1 1 4 0v5"/></svg> Клик по форме — внутрь</span></div>

  <div id="detail" onclick="if(event.target===this)closeDetail()"><div class="panel" id="panel"></div></div>

<script type="module">
import * as THREE from '/vendor/three.module.min.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* часы */
function tick(){ const d=new Date(); $('clk').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  $('clkd').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'}); }
tick(); setInterval(tick,10000);

/* категории */
const CATS=[
  {key:'services', nm:'Сервисы',    cc:0x1ce5e8, geo:'octa',  icon:'<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>'},
  {key:'apps',     nm:'Приложения', cc:0xfe7f2d, geo:'box',   icon:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>'},
  {key:'agents',   nm:'Агенты',     cc:0xa06bff, geo:'ico',   icon:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M8 2v2M16 2v2"/><circle cx="9" cy="14" r="1.3"/><circle cx="15" cy="14" r="1.3"/>'},
  {key:'bots',     nm:'Боты',       cc:0x3aa0ff, geo:'dodeca',icon:'<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M9 13v2M15 13v2"/>'},
  {key:'vps',      nm:'VPS',        cc:0x28e0a8, geo:'torus',  icon:'<path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.6A4 4 0 0 0 6 19z"/>'},
  {key:'conn',     nm:'Подключения',cc:0xff5db1, geo:'knot',  icon:'<path d="M9 12h6M8 7a5 5 0 0 0 0 10h2M16 7a5 5 0 0 1 0 10h-2"/>'},
  {key:'secrets',  nm:'Секреты',    cc:0xffc23d, geo:'tetra', icon:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'},
];
const hex=n=>'#'+n.toString(16).padStart(6,'0');
let DATA={};
const norm=s=>String(s||'').toLowerCase();
const isVps=s=>/vps|впс|server|серв|cloud/.test(norm(s.host));
const isBot=s=>s.kind==='bot'||(Array.isArray(s.bots)&&s.bots.length>0);
const isApp=s=>s.kind==='app';
async function loadData(){
  let st={services:[],discovered:[]}, agents={agents:[]}, secrets={items:[]}, conn=null;
  try{ st=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  try{ agents=await fetch('/api/agents',{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  try{ secrets=await fetch('/api/secrets',{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  try{ conn=await fetch('/api/conn/access',{cache:'no-store'}).then(r=>r.json()); }catch(e){}
  const svc=st.services||[]; const stateOf=s=>s.up?'up':(isVps(s)||isApp(s)?'unk':'down');
  const map=arr=>arr.map(s=>({nm:s.name, state:stateOf(s), meta:s.kind==='app'?(s.app&&s.app.version?'v'+s.app.version:'приложение'):(s.port?':'+s.port:(s.host||''))}));
  DATA={
    services:{items:map(svc.filter(s=>!isBot(s)&&!isApp(s)&&!isVps(s)))},
    apps:{items:map(svc.filter(isApp))},
    bots:{items:svc.filter(isBot).flatMap(s=>(s.bots&&s.bots.length?s.bots.map(b=>({nm:(b&&b.user)||s.name,state:s.up?'up':'unk',meta:(b&&b.name)||s.agent||'бот'})):[{nm:s.name,state:s.up?'up':'unk',meta:s.agent||'бот'}]))},
    vps:{items:map(svc.filter(s=>!isBot(s)&&!isApp(s)&&isVps(s)))},
    agents:{items:(agents.agents||[]).map(a=>({nm:a.label,state:'up',meta:(a.count||0)+' MCP',av:'/logos/'+a.id+'.png'}))},
    conn:{items:conn&&conn.services?conn.services.map(s=>({nm:s.label,state:'unk',meta:(s.grantedBy||[]).length+' программ'})):[]},
    secrets:{items:(secrets.items||[]).map(s=>({nm:s.name,state:'up',meta:s.note||'в Keychain'}))},
  };
  for(const c of CATS){ (DATA[c.key]=DATA[c.key]||{items:[]}).count=DATA[c.key].items.length; }
  updateLabels();
}

/* ── Three.js сцена ── */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x03040c, 0.028);
const camera=new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
let camDist=17; camera.position.set(0,4.5,camDist);
camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0x2a3570, 1.1));
const keyLight=new THREE.PointLight(0x88a0ff, 120, 60); keyLight.position.set(0,0,0); scene.add(keyLight);
const rim=new THREE.DirectionalLight(0x66d0ff, 0.5); rim.position.set(6,8,4); scene.add(rim);

/* glow-текстура (мягкое сияние) */
function glowTex(){ const s=128, c=document.createElement('canvas'); c.width=c.height=s; const g=c.getContext('2d');
  const rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); rg.addColorStop(0,'rgba(255,255,255,1)'); rg.addColorStop(.25,'rgba(255,255,255,.55)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg; g.fillRect(0,0,s,s); return new THREE.CanvasTexture(c); }
const GLOW=glowTex();
function glowSprite(color, scale){ const m=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW, color, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  m.scale.set(scale,scale,1); return m; }

/* звёзды */
(function starfield(){ const N=2200, pos=new Float32Array(N*3), col=new Float32Array(N*3), c=new THREE.Color();
  for(let i=0;i<N;i++){ const r=40+Math.random()*90, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=(Math.random()-.5)*70; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    c.setHSL(.6+Math.random()*.12, .5, .5+Math.random()*.5); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:.32, vertexColors:true, transparent:true, opacity:.9, depthWrite:false, blending:THREE.AdditiveBlending}))); })();

/* туманности */
for(const [color,x,y,z,sc] of [[0xa06bff,-14,6,-18,26],[0x1ce5e8,16,-4,-20,30],[0x3aa0ff,0,-12,-24,34]]){
  const s=glowSprite(color, sc); s.position.set(x,y,z); s.material.opacity=.14; scene.add(s); }

/* ядро */
const core=new THREE.Group(); scene.add(core);
const coreMat=new THREE.MeshStandardMaterial({color:0x2a2f6b, emissive:0x6a5bff, emissiveIntensity:1.5, metalness:.4, roughness:.25});
const coreMesh=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1), coreMat); core.add(coreMesh);
const coreWire=new THREE.Mesh(new THREE.IcosahedronGeometry(1.85,1), new THREE.MeshBasicMaterial({color:0x9db4ff, wireframe:true, transparent:true, opacity:.25})); core.add(coreWire);
core.add(glowSprite(0x7a6bff, 9));
const ringGeo=new THREE.RingGeometry(2.4,2.5,80);
const ring=new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color:0x1ce5e8, transparent:true, opacity:.35, side:THREE.DoubleSide})); ring.rotation.x=Math.PI/2; core.add(ring);

/* формы категорий */
const orbit=new THREE.Group(); scene.add(orbit);
function makeGeo(kind){ switch(kind){
  case 'octa':return new THREE.OctahedronGeometry(1,0);
  case 'box':return new THREE.BoxGeometry(1.4,1.4,1.4);
  case 'ico':return new THREE.IcosahedronGeometry(1.1,0);
  case 'dodeca':return new THREE.DodecahedronGeometry(1.1,0);
  case 'torus':return new THREE.TorusGeometry(.85,.34,16,40);
  case 'knot':return new THREE.TorusKnotGeometry(.7,.26,90,16);
  case 'tetra':return new THREE.TetrahedronGeometry(1.25,0);
  default:return new THREE.SphereGeometry(1,32,32); } }
const R=6.2, nodes=[];
CATS.forEach((c,i)=>{ const ang=(i/CATS.length)*Math.PI*2, x=Math.cos(ang)*R, z=Math.sin(ang)*R;
  const g=new THREE.Group(); g.position.set(x,0,z);
  const mat=new THREE.MeshStandardMaterial({color:c.cc, emissive:c.cc, emissiveIntensity:.9, metalness:.5, roughness:.2, flatShading:true});
  const mesh=new THREE.Mesh(makeGeo(c.geo), mat); mesh.userData.key=c.key; g.add(mesh);
  const wf=new THREE.Mesh(makeGeo(c.geo), new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:.12})); wf.scale.setScalar(1.05); g.add(wf);
  g.add(glowSprite(c.cc, 4.2));
  orbit.add(g); nodes.push({cat:c, group:g, mesh, phase:Math.random()*Math.PI*2}); });

/* HTML-подписи */
const labelsWrap=$('labels');
nodes.forEach(n=>{ const el=document.createElement('div'); el.className='lbl'; el.dataset.key=n.cat.key;
  el.innerHTML=`<div class="nm" style="color:${hex(n.cat.cc)}">${n.cat.nm}</div><div class="ct" style="color:var(--mut)"><b style="color:${hex(n.cat.cc)}">0</b> шт.</div>`;
  labelsWrap.appendChild(el); n.label=el; });
function updateLabels(){ nodes.forEach(n=>{ if(n.label){ const b=n.label.querySelector('b'); if(b) b.textContent=(DATA[n.cat.key]?.count)||0; } }); }
const _v=new THREE.Vector3();
function projectLabels(){ nodes.forEach(n=>{ n.group.getWorldPosition(_v); _v.y+=1.6; _v.project(camera);
  const vis=_v.z<1; n.label.style.opacity=vis?'1':'0';
  n.label.style.left=((_v.x*.5+.5)*vw())+'px'; n.label.style.top=((-_v.y*.5+.5)*vh())+'px'; }); }

/* управление */
let rotY=0.4, rotX=0.42, drag=false, lx=0, ly=0, auto=true;
canvas.addEventListener('pointerdown',e=>{ drag=true; auto=false; lx=e.clientX; ly=e.clientY; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{ if(drag){ rotY+=(e.clientX-lx)*0.006; rotX=Math.max(-0.2,Math.min(1.2, rotX+(e.clientY-ly)*0.005)); lx=e.clientX; ly=e.clientY; } });
canvas.addEventListener('pointerup',e=>{ drag=false; canvas.classList.remove('drag'); setTimeout(()=>auto=true,2600); handleClick(e); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); camDist=Math.max(9,Math.min(30, camDist+e.deltaY*0.012)); },{passive:false});
window.zoomBy=d=>{ camDist=Math.max(9,Math.min(30, camDist+d*2.2)); };
window.resetView=()=>{ rotY=0.4; rotX=0.42; camDist=17; auto=true; };

/* клик по форме → деталь */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let downX=0,downY=0;
canvas.addEventListener('pointerdown',e=>{ downX=e.clientX; downY=e.clientY; });
function handleClick(e){ if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>6) return;  // это был драг, не клик
  mouse.x=(e.clientX/vw())*2-1; mouse.y=-(e.clientY/vh())*2+1;
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(nodes.map(n=>n.mesh),false);
  if(hit.length) openDetail(hit[0].object.userData.key); }

/* анимация */
const clock=new THREE.Clock();
function animate(){ requestAnimationFrame(animate); const t=clock.getElapsedTime();
  if(auto&&!drag) rotY+=0.0016;
  orbit.rotation.y=rotY; orbit.rotation.x=rotX*0.0; // формы держим ровно, вращаем всю группу вокруг Y
  scene.rotation.x=rotX; scene.rotation.y=0;
  core.rotation.y+=0.004; core.rotation.x=Math.sin(t*.3)*0.1;
  coreMesh.scale.setScalar(1+Math.sin(t*1.8)*0.05); coreMat.emissiveIntensity=1.3+Math.sin(t*1.8)*0.4;
  ring.rotation.z+=0.003;
  nodes.forEach((n,i)=>{ n.group.rotation.y+=0.01; n.group.rotation.x+=0.006;
    n.group.position.y=Math.sin(t*0.8+n.phase)*0.35; });
  camera.position.z=camDist; camera.position.y=4.5; camera.lookAt(0,0,0);
  projectLabels();
  renderer.render(scene,camera); }

function vw(){ return innerWidth||document.documentElement.clientWidth||1280; }
function vh(){ return innerHeight||document.documentElement.clientHeight||800; }
function onResize(){ const w=vw(),h=vh(); camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }
addEventListener('resize',onResize); onResize();

/* деталь категории (HTML overlay) */
window.openDetail=function(key){ const c=CATS.find(x=>x.key===key), d=DATA[key]||{items:[]};
  const stLbl=s=>s==='up'?'работает':s==='down'?'не работает':'—';
  const items=d.items&&d.items.length? d.items.map(it=>`<div class="item">
      ${it.av?`<img class="av" src="${esc(it.av)}" onerror="this.remove()">`:`<span class="dot ${it.state}"></span>`}
      <div><div class="nm">${esc(it.nm)}</div>${it.meta?`<div class="meta">${esc(it.meta)}</div>`:''}</div>
      <span class="right">${stLbl(it.state)}</span></div>`).join('') : `<div class="empty">Пока пусто в этой категории.</div>`;
  $('panel').style.setProperty('--cc',hex(c.cc));
  $('panel').innerHTML=`<div class="phead" style="--cc:${hex(c.cc)}">
      <div class="orb" style="--cc:${hex(c.cc)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg></div>
      <div><h2>${c.nm}</h2><div class="pc">${d.count||0} элементов</div></div><button class="x" onclick="closeDetail()">×</button></div>
    <div class="plist">${items}</div>`;
  $('detail').classList.add('show'); };
window.closeDetail=function(){ $('detail').classList.remove('show'); };
addEventListener('keydown',e=>{ if(e.key==='Escape')closeDetail(); });

/* старт */
loadData().then(()=>{ $('loading').style.display='none'; }); setInterval(loadData,15000);
animate();
</script>
</body>
</html>
